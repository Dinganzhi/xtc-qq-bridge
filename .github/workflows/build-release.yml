name: build-release

# 触发方式：
#   - 推送到 main / dev      -> 只跑测试（不编译，省时间）
#   - 打 tag（v* 或 1.0.0 这类裸版本号）-> 只编译 + 上传 Actions 产物，**不会**自动发 Release
#   - 手动 workflow_dispatch -> 编译 + 上传 Actions 产物；必须显式勾选 publish 才创建 Release
#
# 分支约定：日常开发推 dev，main 只保留确认发布的正式版（确认发布时才把 dev 合并进 main）。
# 本项目约定“没有明确指示就不发布正式版”，所以发布这一步只能由人在
# Actions 页面手动勾选 publish 触发，打 tag 不会自动发布。
on:
  push:
    branches: [main, dev]
    # 同时支持 v1.2.0 与裸版本号 1.0.0-alpha.1（本项目 tag 不带 v）
    tags: ["v*", "*.*.*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "编译模式"
        type: choice
        options: [onefile, standalone]
        default: onefile
      publish:
        description: "是否创建/更新 GitHub Release（默认否；只有明确要发布时才勾选）"
        type: boolean
        default: false
      tag_name:
        description: "发布到哪个 tag（如 1.0.0-alpha.1；勾了 publish 必填，否则会把分支名当 tag）"
        type: string
        default: ""
      prerelease:
        description: "预发布版？alpha/beta/rc 保持 true；稳定版改 false"
        type: boolean
        default: true
      body_path:
        description: "Release Notes 文件路径（仓库内，如 .github/release-notes/1.0.0-alpha.1.md；留空则自动生成）"
        type: string
        default: ""

permissions:
  contents: write        # 发布 Release 需要

jobs:
  # ---------------------------------------------------------------- 先过测试
  test:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r requirements.txt
      - name: Offline test suites
        run: |
          python tools/test_wsa.py
          python tools/test_integration.py
          python tools/test_reported_bugs.py
          python tools/test_paths.py
          python tools/wsa_net_guard.py --test

  # ---------------------------------------------------------------- 矩阵编译
  build:
    name: build ${{ matrix.artifact }}
    needs: test
    # 只有 tag / 手动触发才编译；普通 push 只跑测试
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64（自带 Visual Studio 2022，MSVC）
          - os: windows-latest
            artifact: windows-x86_64
            mode: onefile
          # Linux x86_64：用 22.04 让产物 glibc 门槛更低（22.04 = glibc 2.35）
          - os: ubuntu-22.04
            artifact: linux-x86_64
            mode: onefile
          # Linux arm64：GitHub 的 Arm 原生 runner（公开仓库免费；私有仓库需 Arm 配额）
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            mode: onefile
          # Windows arm64：公开预览 runner（不可用时删掉这一项即可，不影响其它平台）
          - os: windows-11-arm
            artifact: windows-arm64
            mode: onefile
          # macOS（可选，按需删除）
          - os: macos-14
            artifact: macos-arm64
            mode: onefile
          # macos-13（Intel）已被 GitHub 退役，改用 macos-15-intel
          - os: macos-15-intel
            artifact: macos-x86_64
            mode: onefile
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 编译产物不要求目标机器装 Python；这里用 3.12 覆盖面最广（3.10~3.14 都支持）
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install -U -r requirements-build.txt

      - name: Show build environment
        # 诊断步骤：即使自检报错也不要卡住后面的编译（真正缺编译器时，Nuitka 自己的
        # 报错更准确）。这里顺带把 `nuitka --version` 原样打出来，便于排障。
        continue-on-error: true
        run: |
          python -m nuitka --version
          python tools/build_nuitka.py --check-env

      - name: Build with Nuitka (+ built-in smoke test)
        # 驱动脚本编译完会自己在干净目录里跑 --version / --verify（bridge）或 --test（guard），
        # 顺带验证"数据写在 exe 旁边、捆绑资源确实打进包了"，失败即整个 job 失败。
        # WSA 网络守护只适用于 Windows，非 Windows 平台由驱动脚本自动跳过（只编主程序）。
        # 显式用 bash：Nuitka 会把大量进度写到 stderr，而 GitHub 的 pwsh 步骤带
        # $ErrorActionPreference='stop'，在 Windows runner 上可能把正常日志当错误中止步骤。
        shell: bash
        run: python tools/build_nuitka.py --mode ${{ matrix.mode }} --target all --out dist

      - name: Show artifacts
        shell: bash
        run: ls -la dist

      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          mkdir -p upload
          # 产物文件名里**已经**带 <版本>-<系统>-<架构>（见 tools/build_nuitka.py 的
          # product_name），所以这里只做搬运，绝不能再拼一次平台后缀——之前那样拼出来的
          # 名字是 `...-linux-arm64-linux-arm64`、`...exe-windows-x86_64`。
          for f in dist/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *.build|*.onefile-build) continue ;;   # 中间目录，不进包
            esac
            cp -r "$f" "upload/$base"
          done
          ls -la upload

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: upload/*
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  # 只有手动触发并显式勾选 publish=true 才会跑，打 tag 不会自动发布。
  # 产物与校验和都在 CI 里生成并直接挂到 Release 上，无需本地下载。
  release:
    name: publish release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Package AstrBot plugin (zip)
        shell: bash
        run: |
          set -e
          ver="${{ inputs.tag_name || github.ref_name }}"
          # 版本号可能带 v 前缀，插件包名统一成"不带 v"的形式，与产物命名一致
          ver="${ver#v}"
          cd astrbot_plugin_xtc_bridge/.. && zip -r "artifacts/astrbot_plugin_xtc_bridge-${ver}.zip" astrbot_plugin_xtc_bridge -x '*/__pycache__/*' >/dev/null
          ls -la artifacts

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -e
          cd artifacts
          # 去掉每个产物自带的 .sha256（内容重复），统一生成一份汇总校验文件
          find . -maxdepth 1 -name '*.sha256' -delete
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: List files
        run: ls -la artifacts

      - name: Create/Update release
        uses: softprops/action-gh-release@v3
        with:
          # dispatch 时必须给 tag_name（否则会把分支名当 tag）
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name || github.ref_name }}
          # alpha/beta/rc 勾选预发布；稳定版把 prerelease 输入设为 false
          prerelease: ${{ inputs.prerelease }}
          make_latest: "false"
          body_path: ${{ inputs.body_path }}
          generate_release_notes: ${{ inputs.body_path == '' }}
          files: artifacts/*
          fail_on_unmatched_files: false
